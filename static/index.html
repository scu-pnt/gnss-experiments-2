<!DOCTYPE html>
<html>
    <head>
        <title>GPS Decode</title>
        <link rel="stylesheet" href="main.css">
    </head>
    <body>
        <h2>Receiver Properties</h2>
        <p>
            <b>Data properties:</b> sample rate = <span id="sample-rate">0</span> MS/s; <span id="num-samples">0</span> samples processed<br>
            <b>Acquisition settings:</b> <span id="acquisition-settings"></span><br>
        </p>
        <h2>Channels</h2>
        <div id="channels-list">
            <div id="channel-template" style="display: none">
                <h3>GPS <span class="prn-num"></span></h3>
                <p>
                    <b>Status:</b> <span class="status"></span><br>
                </p>
                <p class="tracking-stats" style="display: none">
                    <b>Code delay:</b> <span class="code-delay"></span> chips<br>
                    <b>Carrier shift:</b> <span class="freq-shift"></span> Hz<br>
                    <canvas class="iq-plot" width="500" height="150"></canvas>
                    <canvas class="iq-constellation" width="150" height="150"></canvas>
                </p>
                <p class="search-progress" style="display: none">
                    <b>Integrating:</b> <span class="num-integrations"></span><br>
                </p>
                <div class="search-results" style="display: none">
                    <p><b>Peak ratio:</b> <span class="peak-ratio"></span></p>
                    <canvas class="correls-plot" width="600" height="100"></canvas>
                    <canvas class="correls-plot-raw" style="display: none"></canvas>
                </div>
            </div>
        </div>
        <script src="colormap.js"></script>
        <script src="decode.js"></script>
    </body>
</html>
